[agent]
fps = 10
window_title_contains = BPER
router = llm
monitor_index = 1
show_capture_border = true
route_retry_seconds = 1.0

[api]
base_url = http://localhost:8081

[minio]
endpoint = http://localhost:9000
access_key = minioadmin
secret_key = minioadmin
bucket = edge-agent-frames

[llm]
provider = openai
base_url = https://api.openai.com/v1
model = gpt-4o-mini
timeout = 60
api_key = REDACTED_OPENAI_API_KEY

[dataset]
enabled = true
bucket = page-dataset
confidence_threshold = 0.8
max_per_page = 3

[debug]
show_llm_tab = true
